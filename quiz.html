<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis - QuizMaster</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="quiz-body">
    <div class="particles" id="particles"></div>

    <!-- Entry Form -->
    <div id="entryScreen" class="entry-screen">
        <div class="entry-card">
            <div class="entry-header">
                <i class="fas fa-brain entry-logo"></i>
                <h1>QuizMaster</h1>
            </div>
            <div class="quiz-info-card" id="quizInfoCard">
                <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Memuat kuis...</div>
            </div>
            <div id="entryForm" style="display:none">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nama Lengkap</label>
                    <input type="text" id="studentName" placeholder="Masukkan nama lengkap Anda">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-id-card"></i> Nomor Absen / NIS</label>
                    <input type="text" id="studentId" placeholder="Masukkan nomor absen atau NIS">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-school"></i> Kelas</label>
                    <input type="text" id="studentClass" placeholder="Contoh: X IPA 1">
                </div>
                <button class="btn-primary btn-full btn-large" onclick="startQuiz()">
                    <i class="fas fa-play"></i> Mulai Kuis
                </button>
            </div>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quizScreen" class="quiz-screen" style="display:none">
        <!-- Top Bar -->
        <div class="quiz-topbar">
            <div class="topbar-left">
                <span class="quiz-badge" id="qSubject">Mata Pelajaran</span>
            </div>
            <div class="topbar-center">
                <div class="timer" id="timer">
                    <i class="fas fa-clock"></i>
                    <span id="timerText">30:00</span>
                </div>
            </div>
            <div class="topbar-right">
                <span class="progress-text"><span id="currentQ">1</span>/<span id="totalQ">10</span></span>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar" style="width:0%"></div>
        </div>

        <!-- Question Area -->
        <div class="quiz-container">
            <div class="question-card" id="questionCard">
                <div class="question-header">
                    <span class="question-number" id="questionNumber">Soal 1</span>
                    <span class="question-type" id="questionType">Pilihan Ganda</span>
                </div>
                <div class="question-text" id="questionText"></div>
                <div class="options-container" id="optionsContainer"></div>
            </div>

            <!-- Navigation -->
            <div class="quiz-nav">
                <button class="btn-secondary" id="btnPrev" onclick="prevQuestion()" disabled>
                    <i class="fas fa-chevron-left"></i> Sebelumnya
                </button>
                <div class="question-dots" id="questionDots"></div>
                <button class="btn-primary" id="btnNext" onclick="nextQuestion()">
                    Selanjutnya <i class="fas fa-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Question Navigator (bottom sheet on mobile) -->
        <button class="btn-navigator" onclick="toggleNavigator()">
            <i class="fas fa-th"></i> <span id="answeredCount">0</span>/<span id="totalCount">0</span>
        </button>
        <div class="navigator-panel" id="navigatorPanel">
            <div class="navigator-header">
                <h3>Navigasi Soal</h3>
                <button onclick="toggleNavigator()"><i class="fas fa-times"></i></button>
            </div>
            <div class="navigator-grid" id="navigatorGrid"></div>
            <div class="navigator-legend">
                <span><span class="dot dot-answered"></span> Terjawab</span>
                <span><span class="dot dot-current"></span> Saat ini</span>
                <span><span class="dot dot-empty"></span> Belum dijawab</span>
            </div>
            <button class="btn-primary btn-full" onclick="submitQuiz()" id="btnSubmit">
                <i class="fas fa-paper-plane"></i> Kumpulkan Jawaban
            </button>
        </div>
    </div>

    <!-- Result Screen -->
    <div id="resultScreen" class="result-screen" style="display:none">
        <div class="result-card">
            <div class="result-animation" id="resultAnimation">
                <div class="confetti"></div>
            </div>
            <div class="result-icon" id="resultIcon">🎉</div>
            <h1 id="resultTitle">Selesai!</h1>
            <p id="resultSubtitle">Kamu telah menyelesaikan kuis</p>
            
            <div class="score-circle">
                <svg viewBox="0 0 36 36" class="circular-chart">
                    <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    <path class="circle" id="scoreCircle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                </svg>
                <div class="score-value" id="scoreValue">0</div>
            </div>

            <div class="result-details">
                <div class="result-stat">
                    <i class="fas fa-check-circle" style="color:#22c55e"></i>
                    <span>Benar: <b id="correctCount">0</b></span>
                </div>
                <div class="result-stat">
                    <i class="fas fa-times-circle" style="color:#ef4444"></i>
                    <span>Salah: <b id="wrongCount">0</b></span>
                </div>
                <div class="result-stat">
                    <i class="fas fa-clock" style="color:#f59e0b"></i>
                    <span>Waktu: <b id="timeSpent">-</b></span>
                </div>
            </div>

            <div class="result-actions">
                <button class="btn-primary" onclick="viewReview()">
                    <i class="fas fa-search"></i> Lihat Pembahasan
                </button>
                <a href="index.html" class="btn-secondary">
                    <i class="fas fa-home"></i> Kembali
                </a>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div class="modal-overlay" id="reviewModal">
        <div class="modal modal-full">
            <button class="modal-close" onclick="closeModal('reviewModal')">&times;</button>
            <div class="modal-header">
                <h2><i class="fas fa-search"></i> Pembahasan Soal</h2>
            </div>
            <div class="modal-body" id="reviewContent"></div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
